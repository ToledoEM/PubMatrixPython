[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pubmatrixpython"
version = "0.3.0"
description = "Python port of PubMatrixR — systematic literature co-occurrence analysis via NCBI PubMed"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md", "LICENSE"]
authors = [
    { name = "Enrique Toledo", email = "enriquetoledo@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["pubmed", "literature-mining", "bioinformatics", "ncbi", "co-occurrence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "matplotlib>=3.10,<4",
    "pandas>=2.0,<4",
    "requests>=2.33,<3",
    "scipy>=1.10,<2",
    "seaborn>=0.13,<1",
    "tqdm>=4.60,<5",
]

[project.urls]
Homepage = "https://toledoem.github.io/pubmatrixp/"
Repository = "https://github.com/ToledoEM/PubMatrixPython"
Changelog = "https://github.com/ToledoEM/PubMatrixPython/blob/main/CHANGELOG.md"

[project.optional-dependencies]
ods = ["odfpy>=1.4.1"]

[dependency-groups]
dev = [
    "ipykernel>=6.0",
    "jupyter>=1.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
docs = [
    "zensical>=0.0.71; python_version >= '3.11'",
    "nbconvert>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["pubmatrix"]

[tool.uv]
required-version = ">=0.13.7"
