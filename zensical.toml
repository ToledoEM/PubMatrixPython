[project]
site_name = "PubMatrixPython"
site_description = "Multiplex literature mining against PubMed and PMC"
site_url = "https://toledoem.github.io/PubMatrixPython/"
docs_dir = "docs"
site_dir = "site"
copyright = 'Docs made with <a href="https://zensical.org">Zensical</a> · PubMatrixPython developed by ToledoEM · MIT License'
repo_url = "https://github.com/ToledoEM/PubMatrixPython"
repo_name = "ToledoEM/PubMatrixPython"

# index.md and notebooks/ are generated by scripts/build_docs.py
nav = [
  { "Home" = "index.md" },
  { "Notebooks" = [
    { "Getting started" = "notebooks/01_pubmatrix.md" },
    { "Wnt / obesity example" = "notebooks/02_example_wnt.md" },
  ] },
  { "Performance" = "performance.md" },
  { "Troubleshooting" = "troubleshooting.md" },
]

[project.extra]
generator = false

[project.theme]
language = "en"
icon.repo = "fontawesome/brands/github"
features = [
  "content.code.copy",
  "content.code.select",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
